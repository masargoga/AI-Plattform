spring:
  application:
    name: agenticpilot
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

agenticpilot:
  seed:
    password: ${AGENTICPILOT_SEED_PASSWORD:}
  website:
    max-pages: ${AGENTICPILOT_WEBSITE_MAX_PAGES:50}
    request-delay: ${AGENTICPILOT_WEBSITE_REQUEST_DELAY:1s}
  api:
    rate-limit-per-minute: ${AGENTICPILOT_API_RATE_LIMIT:60}
  model:
    provider: ${AGENTICPILOT_MODEL_PROVIDER:claude}
    api-key: ${AGENTICPILOT_MODEL_API_KEY:}
    base-url: ${AGENTICPILOT_MODEL_BASE_URL:https://api.anthropic.com}
    eu-allowed: ${AGENTICPILOT_MODEL_EU_ALLOWED:false}
    timeout: ${AGENTICPILOT_MODEL_TIMEOUT:30s}
    names:
      fast: ${AGENTICPILOT_MODEL_FAST:claude-haiku-5-5}
      balanced: ${AGENTICPILOT_MODEL_BALANCED:claude-sonnet-5-5}
      deep: ${AGENTICPILOT_MODEL_DEEP:claude-opus-5-5}

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    probes:
      enabled: true

server:
  port: 8080
  shutdown: graceful

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.agenticpilot
