spring:
  lifecycle:
    timeout-per-shutdown-phase: ${AGENTICPILOT_SHUTDOWN_TIMEOUT:30s}
  application:
    name: agenticpilot
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

agenticpilot:
  seed:
    password: ${AGENTICPILOT_SEED_PASSWORD:}
  website:
    max-pages: ${AGENTICPILOT_WEBSITE_MAX_PAGES:50}
    request-delay: ${AGENTICPILOT_WEBSITE_REQUEST_DELAY:1s}
  auth:
    secure-cookies: ${AGENTICPILOT_SECURE_COOKIES:false}
    remember-me-hours: ${AGENTICPILOT_SESSION_HOURS:12}
  api:
    rate-limit-per-minute: ${AGENTICPILOT_API_RATE_LIMIT:60}
  model:
    provider: ${AGENTICPILOT_MODEL_PROVIDER:claude}
    api-key: ${AGENTICPILOT_MODEL_API_KEY:}
    base-url: ${AGENTICPILOT_MODEL_BASE_URL:https://api.anthropic.com}
    eu-allowed: ${AGENTICPILOT_MODEL_EU_ALLOWED:false}
    timeout: ${AGENTICPILOT_MODEL_TIMEOUT:30s}
    names:
      fast: ${AGENTICPILOT_MODEL_FAST:claude-haiku-5-5}
      balanced: ${AGENTICPILOT_MODEL_BALANCED:claude-sonnet-5-5}
      deep: ${AGENTICPILOT_MODEL_DEEP:claude-opus-5-5}

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    enabled: false

management:
  server:
    # Unset: metrics and probes share the application port. Set (e.g. 8081) to keep them off the public port.
    port: ${AGENTICPILOT_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    probes:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${AGENTICPILOT_SECURE_COOKIES:false}

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.agenticpilot
