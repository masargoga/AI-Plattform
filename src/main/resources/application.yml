spring:
  application:
    name: agenticpilot
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

agenticpilot:
  seed:
    password: ${AGENTICPILOT_SEED_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    probes:
      enabled: true

server:
  port: 8080
  shutdown: graceful

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.agenticpilot
