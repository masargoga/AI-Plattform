<title>Foreman</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail + workspace on desktop; top bar + bottom tabs on phones. Agent and skill pages pair a setup column with a live test panel. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#12201D; --ink-2:#4F625D; --ink-3:#7B8C87;
  --line:#DCE3E0; --line-2:#E8EDEB; --switch-off:#C3CDCA;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1EC; --accent-text:#0A5F52;
  --warn:#8F5A00; --warn-soft:#FBEFD4; --good:#1B7F45; --good-soft:#DDF3E5; --bad:#B3321F; --bad-soft:#FBE3DE;
  --e1:#0E7C6B; --e1s:#DDF1EC; --e2:#A64B08; --e2s:#FBE9D2; --e3:#3B5BDB; --e3s:#E1E8FD; --e4:#A8326B; --e4s:#F8E0EC;
  --shadow:0 1px 2px rgba(18,32,29,.05),0 8px 24px rgba(18,32,29,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#131C1A; --surface-2:#18231F; --ink:#E7EFEC; --ink-2:#A3B5AF; --ink-3:#74867F;
  --line:#263632; --line-2:#1E2C28; --switch-off:#3A4A46;
  --accent:#3FD1B4; --accent-ink:#04201A; --accent-soft:#12342D; --accent-text:#7BE3CD;
  --warn:#E5B04A; --warn-soft:#3A2E12; --good:#5ED08A; --good-soft:#12301F; --bad:#F08070; --bad-soft:#3C1A15;
  --e1:#3FD1B4; --e1s:#12342D; --e2:#F0A35B; --e2s:#3A2A16; --e3:#8FA6FF; --e3s:#1B2447; --e4:#F08DBA; --e4s:#3C1B2D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#131C1A; --surface-2:#18231F; --ink:#E7EFEC; --ink-2:#A3B5AF; --ink-3:#74867F;
  --line:#263632; --line-2:#1E2C28; --switch-off:#3A4A46;
  --accent:#3FD1B4; --accent-ink:#04201A; --accent-soft:#12342D; --accent-text:#7BE3CD;
  --warn:#E5B04A; --warn-soft:#3A2E12; --good:#5ED08A; --good-soft:#12301F; --bad:#F08070; --bad-soft:#3C1A15;
  --e1:#3FD1B4; --e1s:#12342D; --e2:#F0A35B; --e2s:#3A2A16; --e3:#8FA6FF; --e3s:#1B2447; --e4:#F08DBA; --e4s:#3C1B2D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font:650 clamp(28px,4vw,38px)/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
h2{font:600 18px/1.25 var(--font-display);letter-spacing:-.01em}
h3{font:600 17px/1.25 var(--font-display)}
.sub{color:var(--ink-2);max-width:60ch;margin-top:6px}
.small{font-size:13px}.muted{color:var(--ink-3)}.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:24px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);letter-spacing:-.02em}
.logo-bg{fill:var(--accent)}.logo-fg{stroke:var(--accent-ink);fill:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;color:var(--ink-2);font-weight:600;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--surface)}
.nav-item.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav-item.on svg{color:var(--accent)}
.nav-item em{margin-left:auto;font:500 12px var(--font-mono);color:var(--ink-3);font-style:normal}
.rail-note{border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:13px;color:var(--ink-2)}
.rail-note strong{display:block;color:var(--ink);margin-bottom:2px}
.mtop{display:none;align-items:center;justify-content:space-between;margin-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-mono);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill.ok{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:0;background:transparent;color:var(--ink-3);font-size:12px;font-weight:600;cursor:pointer;border-radius:10px}
.tab.on{color:var(--accent-text)}
.tab .tb-ic{display:grid;place-items:center;width:48px;height:28px;border-radius:99px}
.tab.on .tb-ic{background:var(--accent-soft)}

.ph{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px 24px;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--ink-3);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink-2);font-weight:600;min-height:40px;padding:0 8px 0 0;cursor:pointer}
.back:hover{color:var(--ink)}
.linkish{border:0;background:transparent;padding:0;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.linkish:hover{color:var(--accent-text);text-decoration:underline}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.search{position:relative;flex:1 1 200px;max-width:340px}
.search svg{position:absolute;left:12px;top:12px;color:var(--ink-3)}
.search input{padding-left:38px!important}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field textarea,.field select,.search input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.field textarea{resize:vertical;line-height:1.5}
.field textarea.mono{font:400 14px/1.6 var(--font-mono)}
.field input:focus,.field textarea:focus,.field select:focus,.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.hint{font-size:13px;color:var(--ink-3)}
.err{font-size:13px;color:var(--bad)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-text)}
.mtabs{display:none;margin-bottom:16px}.mtabs .seg{display:flex}.mtabs .seg button{flex:1}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.switch{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--switch-off);cursor:pointer;padding:0;flex:none;transition:background .15s}
.switch::before{content:"";position:absolute;inset:-9px -4px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

.how{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:24px}
.how-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 0 18px}
.how ol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;padding:0;list-style:none}
.how li{padding:10px 18px 16px;display:flex;flex-direction:column;gap:2px}
.how li+li{border-left:1px solid var(--line-2)}
.how b{font:500 12px var(--font-mono);color:var(--accent-text)}
.how span{font-size:14px;color:var(--ink-2)}
.how strong{font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card[data-action]{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card[data-action]:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.acard,.scard{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ac-top{display:flex;gap:12px;align-items:flex-start}
.ac-id{flex:1;min-width:0}
.ac-id p{color:var(--ink-2);font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;padding:3px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.ac-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.ac-foot span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.dot.paused{background:var(--ink-3)}
.newtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;border:1.5px dashed var(--line);border-radius:14px;background:transparent;color:var(--ink-2);font-weight:600;cursor:pointer}
.newtile:hover{border-color:var(--accent);color:var(--accent-text)}
.emb{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font:700 15px var(--font-display);flex:none}
.emb.lg{width:56px;height:56px;font-size:19px;border-radius:14px}
.emb.sm{width:24px;height:24px;font-size:10px;border-radius:7px}
.e1{background:var(--e1s);color:var(--e1)}.e2{background:var(--e2s);color:var(--e2)}.e3{background:var(--e3s);color:var(--e3)}.e4{background:var(--e4s);color:var(--e4)}
.emb.sk{background:var(--accent-soft);color:var(--accent-text)}
.stack{display:inline-flex}.stack .emb{margin-left:-6px;border:2px solid var(--surface)}.stack .emb:first-child{margin-left:0}
.badge{font:500 11px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-Instruction{background:var(--accent-soft);color:var(--accent-text)}.t-Workflow{background:var(--warn-soft);color:var(--warn)}.t-Tool{background:var(--e3s);color:var(--e3)}
.scard p{color:var(--ink-2);font-size:14px}
.sc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--ink-2)}

.ah{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:8px 0 20px}
.ah-main{flex:1 1 260px;min-width:0}
.ah-actions{display:flex;gap:14px;align-items:center}
.status-toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.title-input{width:100%;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink);font:650 clamp(24px,3.4vw,30px)/1.2 var(--font-display);letter-spacing:-.02em;padding:2px 0}
.title-input:hover{border-bottom-color:var(--line)}
.title-input:focus{outline:0;border-bottom-color:var(--accent)}
.ag-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:24px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.col.test{position:sticky;top:24px}
.panel{padding:20px;display:flex;flex-direction:column;gap:16px}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-h p{color:var(--ink-2);font-size:14px;margin-top:2px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);flex:none}
.rowempty{padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);font-size:14px}

.test-card{display:flex;flex-direction:column;overflow:hidden}
.tc-h{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.msgs{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:240px;max-height:min(50vh,440px);overflow-y:auto}
.msg{max-width:90%;padding:10px 13px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:var(--surface-2);border:1px solid var(--line-2);border-top-left-radius:4px;align-self:flex-start}
.msg.user{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-top-right-radius:4px}
.trace{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.trace span{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--font-mono);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.prompts{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
.pchip{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer}
.pchip:hover{border-color:var(--accent);color:var(--accent-text)}
.composer{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.composer input{flex:1;min-width:0;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.composer .btn{width:46px;padding:0}
.result{white-space:pre-wrap;font-size:14.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}

.list{display:flex;flex-direction:column;gap:12px}
.srow{padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 16px;align-items:center}
.srow-side{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.mono{font-family:var(--font-mono)}
.num{font:500 13px var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;background:rgba(8,16,14,.55);z-index:40;animation:fade .15s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:rise .22s ease-out}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
.sheet-h p{margin-top:2px}
.sheet-body{overflow-y:auto;padding:8px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px))}
.sheet-f{display:flex;justify-content:flex-end;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line-2)}
.steps{display:flex;gap:6px;margin:4px 0 16px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--accent)}
.sg{display:flex;flex-direction:column;gap:18px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.tpl{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.tpl span{font-size:12.5px;color:var(--ink-3)}
.tpl.on{border-color:var(--accent);background:var(--accent-soft)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tick{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);color:var(--accent-ink);flex:none}
.opt.on .tick{background:var(--accent);border-color:var(--accent)}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kind{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-height:112px}
.kind:hover{border-color:var(--accent)}
.kind span{font-size:12.5px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.dtabs{margin-bottom:16px}
.mob-only{display:none}
.ctls{display:flex;flex-direction:column}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line-2)}
.ctls .ctl:first-child{border-top:0;padding-top:0}
.ctl p{margin-top:2px}
.switch:disabled{opacity:.5;cursor:not-allowed}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter.ok i.on{background:var(--good)}.meter.warn i.on{background:var(--warn)}.meter.bad i.on{background:var(--bad)}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.lock{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-top:2px}
.pchip.g{border-style:dashed;display:inline-flex;align-items:center;gap:6px}
.row.cr{flex-wrap:wrap}.row.cr .row-main{flex:1 1 150px}
.who{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left}
.who.c{width:auto}.who:hover{border-color:var(--ink-3)}
.who-t{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.who-t span{font-size:12px;color:var(--ink-3)}
.diff{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);overflow-wrap:anywhere}
.diff s{color:var(--ink-3)}
.quote{padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.hrow{padding:10px 0;border-top:1px solid var(--line-2)}.hrow p{margin-top:2px}
.tchip:disabled{opacity:.45;cursor:not-allowed}
.logrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.ag-layout[data-tab="guard"] .setup{display:none}
.ag-layout:not([data-tab="guard"]) .guard{display:none}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes blink{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:700px){

}

function chatFor(a){

function msgHTML(m){

 if(m.typing)return '<div class="msg bot typing" aria-label="Typing"><i></i><i></i><i></i></div>';
 return '<div class="msg bot"><div>'+esc(m.text)+'</div>'+(m.trace&&m.trace.length?'<div class="trace">'+m.trace.map((t)=>'<span>'+ic(t.i,12)+esc(t.n)+'</span>').join('')+'</div>':'')+'</div>';

function makeReply(a,text,idx,c){
 const sk=a.skills.map(skillById).filter(Boolean),so=a.sources.map(srcById).filter(Boolean);
 const gr=guardReply(a,text);if(gr&&!gr.note)return gr;const nt=gr&&gr.note!==undefined?gr:null;
 if(!sk.length&&!so.length)return {text:'I have no skills or data attached yet, so I can only answer in general terms. Add a skill or a data source on the left, then ask again.',trace:[]};
 const n=idx!=null?idx:c.filter((x)=>x.role==='user').length-1;
 const r=a.replies&&a.replies.length?a.replies[n%a.replies.length]:null;
 const k=(r&&a.skills.indexOf(r.sk)>-1?skillById(r.sk):null)||sk[0];
 const d=(r&&a.sources.indexOf(r.src)>-1?srcById(r.src):null)||so[0];
 const t=r?r.t:'On it. I would use “'+(k?k.name:'my general knowledge')+'” on your request'+(d?' and read from '+d.name:'')+', then send back a short answer you can check.';
 const trace=[];if(k)trace.push({i:'skills',n:k.name});if(d)trace.push({i:KINDS[d.kind].icon,n:d.name});
 return {text:t+(nt&&nt.note?'\n\nNote: '+nt.note:''),trace:trace.concat(nt?nt.trace:[])};
}
function sendChat(text,idx){
 text=(text||'').trim();if(!text)return;
 const a=agentById(S.agentId);if(!a)return;
 const c=chatFor(a);c.push({role:'user',text:text});
 const tm={role:'bot',typing:true};c.push(tm);paintMsgs();
 const aid=a.id;
 setTimeout(()=>{
  const i=c.indexOf(tm);const r=makeReply(a,text,idx,c);
  if(i>-1)c[i]={role:'bot',text:r.text,trace:r.trace};
  if(S.view==='agent'&&S.agentId===aid)paintMsgs();
 },900);
}

/* ---------- custom guardrails ---------- */
const RACT=[['block','Block'],['mask','Mask'],['approve','Needs approval'],['note','Add a note']];
const RPILL={block:['Block','bad'],mask:['Mask',''],approve:['Needs approval','warn'],note:['Add note','']};
S.rules=[
 {id:'g1',name:'No legal advice',match:'lawsuit, sue, legal advice',action:'block',message:'I cannot give legal advice. Please talk to a lawyer.',scope:'all',agents:[],sample:'Can I sue you over this late order?',on:true},
 {id:'g2',name:'Hide customer numbers',match:'/KD-\\d{4,}/',action:'mask',message:'',scope:'all',agents:[],sample:'My customer number is KD-48213, where is my order?',on:true},
 {id:'g3',name:'Discounts need approval',match:'discount, coupon, rebate',action:'approve',message:'A discount was requested. Please check the customer history.',scope:'selected',agents:['a1'],sample:'Can I get a discount on my next order?',on:true}
];
const rxEsc=(s)=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function ruleRegex(r){
 const m=(r.match||'').trim();if(!m)return null;
 try{
  const p=m.match(/^\/(.+)\/([a-z]*)$/i);
  if(p)return new RegExp(p[1],p[2].replace(/[gi]/g,'')+'gi');
  const w=m.split(',').map((x)=>x.trim()).filter(Boolean).map(rxEsc);
  return w.length?new RegExp('\\b(?:'+w.join('|')+')\\b','gi'):null;
 }catch(e){return null}
}
const appliesTo=(r,a)=>r.on&&r.version>0&&(r.scope==='all'||r.agents.indexOf(a.id)>-1);
function customGuard(a,t){
 const rules=S.rules.filter((r)=>appliesTo(r,a));
 for(let i=0;i<rules.length;i++){
  const r=rules[i],re=ruleRegex(r);if(!re||t.search(re)<0)continue;
  const tr=[{i:'shield',n:r.name}];
  if(r.action==='block'){logAudit(a.name,'Rule “'+r.name+'” blocked a message','Blocked');return {text:r.message||'I cannot help with that.',trace:tr}}
  if(r.action==='approve'){logAudit(a.name,'Rule “'+r.name+'” is waiting for approval','Needs approval');return {text:(r.message||'This needs approval from a person first.')+'\n\nI will continue once it is approved.',trace:[{i:'shield',n:'Waiting for approval'}]}}
  if(r.action==='mask'){logAudit(a.name,'Rule “'+r.name+'” hid text before processing','Masked');return {text:'I hid the matching text before processing: “'+t.replace(re,'[hidden]')+'”\n\nHow can I help with the rest?',trace:tr}}
  if(r.action==='note'){logAudit(a.name,'Rule “'+r.name+'” added a note','Allowed');return {note:r.message||'',trace:tr}}
 }
 return null;
}
const ruleChips=(a)=>S.rules.filter((r)=>appliesTo(r,a)&&r.sample).map((r)=>'<button class="pchip g" data-action="rule-prompt" data-id="'+r.id+'">'+ic('shield',13)+' '+esc(r.name)+'</button>').join('');

function diffRows(r){

 FL.forEach((f)=>{

 });
 return out;
}

 const a=agentById(S.agentId);const sel=S.rules.filter((r)=>r.scope==='selected'&&r.version>0);
 const body=sel.length?'<div class="opts">'+sel.map((r)=>opt('shield',r.name,RPILL[r.action][0]+' · catches '+r.match+(r.pending?' · change pending':''),r.agents.indexOf(a.id)>-1,'toggle-rule-agent',r.id)).join('')+'</div><p class="hint" style="margin-top:12px">Adding or removing an agent is a change. It needs approval before it takes effect.</p>':'<p class="rowempty">No guardrails for selected agents yet. Create one to get started.</p>';
 return shell('Add guardrails','Rules for all agents are managed under Policies. Choose rules for '+esc(a.name)+'.',body,'<button class="btn ghost" data-action="new-rule-for-agent">New guardrail</button><button class="btn primary" data-action="close-sheet">Done</button>');
}
const rulePills=(r)=>(r.version===0?'<span class="pill warn">Not live yet</span>':(r.on?'':'<span class="pill">Off</span>'))+(r.pending&&r.version>0?'<span class="pill warn">Change pending</span>':'');
function customPanel(a){
 const mine=S.rules.filter((r)=>r.scope==='all'||r.agents.indexOf(a.id)>-1);
 const rows=mine.map((r)=>'<div class="row cr"><span class="ico">'+ic('shield')+'</span><div class="row-main"><button class="linkish" data-action="edit-rule" data-id="'+r.id+'">'+esc(r.name)+'</button><span class="small muted">v'+r.version+' · catches '+esc(r.match)+'</span></div>'+rulePills(r)+'<span class="pill '+RPILL[r.action][1]+'">'+RPILL[r.action][0]+'</span>'+(r.scope==='all'?'<span class="pill">All agents</span>':(canEditRule(r)?'<button class="iconbtn" aria-label="Remove '+esc(r.name)+' from this agent" data-action="unassign-rule" data-id="'+r.id+'">'+ic('close',16)+'</button>':''))+'</div>').join('');
 return '<section class="card panel"><div class="panel-h"><div><h2>Custom guardrails</h2><p>Your own rules for words, topics and patterns.</p></div><button class="btn sm" data-action="pick-rule">'+ic('plus',16)+'Add guardrail</button></div><div class="rows">'+(rows||'<div class="rowempty">No custom guardrails. Add one to block a topic, hide a pattern or require approval.</div>')+'</div></section>';
}
function customView(){
 const pend=S.rules.filter((r)=>r.pending);
 const ap=pend.length?'<section class="card panel"><div class="panel-h"><div><h2>Waiting for approval</h2><p>Changes go live only after a second person approves them.</p></div></div><div class="rows">'+pend.map((r)=>'<div class="row cr"><div class="row-main"><strong>'+esc(r.name)+'</strong><span class="small muted">v'+r.pending.v+' proposed by '+esc(r.pending.by)+' · '+esc(r.pending.at)+'</span></div><button class="btn sm primary" data-action="edit-rule" data-id="'+r.id+'">Review</button></div>').join('')+'</div></section>':'';
 const rows=S.rules.map((r)=>'<div class="row cr"><span class="ico">'+ic('shield')+'</span><div class="row-main"><button class="linkish" data-action="edit-rule" data-id="'+r.id+'">'+esc(r.name)+'</button><span class="small muted">v'+r.version+' · '+(r.scope==='all'?'All agents':plural(r.agents.length,'agent'))+' · catches '+esc(r.match)+'</span></div>'+rulePills(r)+'<span class="pill '+RPILL[r.action][1]+'">'+RPILL[r.action][0]+'</span><button class="switch" role="switch" aria-checked="'+r.on+'" aria-label="Turn '+esc(r.name)+' on or off"'+(isAdmin()?' data-action="toggle-rule" data-id="'+r.id+'"':' disabled title="Only admins can turn rules on or off"')+'></button></div>').join('');
 return '<div class="col">'+ap+'<section class="card panel"><div class="panel-h"><div><h2>Custom guardrails</h2><p>Your own rules for words, topics and patterns. Every change is versioned and needs a second person’s approval.</p></div><button class="btn primary sm" data-action="new-rule">'+ic('plus',16)+'New guardrail</button></div>'+(isAdmin()?'':lock('As an agent owner you can propose rules for your own agents.'))+'<div class="rows">'+(rows||'<div class="rowempty">No custom guardrails yet. Create one to block a topic, hide a pattern or require approval.</div>')+'</div></section></div>';
}

/* ---------- sheets ---------- */
function shell(title,sub,body,foot){
 return '<div class="scrim" data-action="close-sheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header class="sheet-h"><div><h2>'+title+'</h2>'+(sub?'<p class="small muted">'+sub+'</p>':'')+'</div><button class="iconbtn" aria-label="Close" data-action="close-sheet">'+ic('close')+'</button></header><div class="sheet-body">'+body+'</div>'+(foot?'<footer class="sheet-f">'+foot+'</footer>':'')+'</section>';
}
function sheetHTML(){
 const sh=S.sheet;
 if(sh.type==='who')return whoSheet();
 if(sh.type==='review')return reviewSheet();
 if(sh.type==='rule')return ruleSheet();
 if(sh.type==='pickRule')return pickRuleSheet();
 if(sh.type==='newAgent'){
  const d=sh.draft;const st=sh.step;let body='';
  const bar='<div class="steps" aria-hidden="true">'+[1,2,3].map((i)=>'<i class="'+(i<=st?'on':'')+'"></i>').join('')+'</div>';
  if(st===1)body='<div class="sg"><div><span class="lbl">Start from</span><div class="tpls">'+TPLS.map((t)=>'<button class="tpl '+(d.tpl===t.id?'on':'')+'" data-action="draft-tpl" data-id="'+t.id+'"><strong>'+t.label+'</strong><span>'+t.hint+'</span></button>').join('')+'</div></div>'+
   '<div class="field"><label for="dName">Name</label><input id="dName" maxlength="40" data-input="draft.name" placeholder="e.g. Support Concierge" value="'+esc(d.name)+'">'+(d.err?'<p class="err">'+d.err+'</p>':'')+'</div>'+
   '<div class="field"><label for="dRole">What is its job?</label><input id="dRole" data-input="draft.role" placeholder="One sentence is enough" value="'+esc(d.role)+'"></div></div>';
  if(st===2)body='<div class="opts">'+S.sources.map((s)=>opt(KINDS[s.kind].icon,s.name,srcMeta(s),d.sources.indexOf(s.id)>-1,'draft-source',s.id)).join('')+'</div>';
  if(st===3)body='<div class="opts">'+S.skills.map((s)=>opt('skills',s.name,s.type+' · '+s.desc,d.skills.indexOf(s.id)>-1,'draft-skill',s.id)).join('')+'</div>';
  const sub=['Name and job','Which data may it read?','Which skills should it have?'][st-1];
  const foot=(st===1?'<button class="btn ghost" data-action="close-sheet">Cancel</button>':'<button class="btn ghost" data-action="draft-back">Back</button>')+(st<3?'<button class="btn primary" data-action="draft-next">Next</button>':'<button class="btn primary" data-action="create-agent">'+ic('check')+'Create agent</button>');
  return shell('New agent','Step '+st+' of 3 · '+sub,bar+body,foot);
 }
 if(sh.type==='pickSkill'||sh.type==='pickSource'){
  const a=agentById(S.agentId);const isS=sh.type==='pickSkill';
  const body='<div class="opts">'+(isS?S.skills.map((s)=>opt('skills',s.name,s.type+' · '+s.desc,a.skills.indexOf(s.id)>-1,'toggle-skill',s.id)):S.sources.map((s)=>opt(KINDS[s.kind].icon,s.name,srcMeta(s),a.sources.indexOf(s.id)>-1,'toggle-source',s.id))).join('')+'</div>';
  const foot=(isS?'<button class="btn ghost" data-action="new-skill">New skill</button>':'<button class="btn ghost" data-action="connect-for-agent">Connect new source</button>')+'<button class="btn primary" data-action="close-sheet">Done</button>';
  return shell(isS?'Add skills':'Add data sources','Tap to attach or remove. Changes apply to '+esc(a.name)+'.',body,foot);
 }
 if(sh.type==='connect'){
  if(sh.step===1)return shell('Connect a source','Where does the data live?','<div class="kinds">'+Object.keys(KINDS).map((k)=>'<button class="kind" data-action="connect-kind" data-v="'+k+'"><span class="ico">'+ic(KINDS[k].icon)+'</span><strong>'+KINDS[k].label+'</strong><span>'+KINDS[k].hint+'</span></button>').join('')+'</div>','');
  const k=KINDS[sh.kind];
  return shell('Connect '+k.label.toLowerCase(),k.hint,'<div class="sg"><div class="field"><label for="cName">Name</label><input id="cName" data-input="conn.name" maxlength="40" placeholder="e.g. Partner FAQ" value="'+esc(sh.name)+'">'+(sh.err?'<p class="err">'+sh.err+'</p>':'')+'</div><div class="field"><label for="cLoc">Where is it?</label><input id="cLoc" data-input="conn.loc" placeholder="'+esc(k.ph)+'" value="'+esc(sh.loc)+'"><p class="hint">The agent gets read-only access. It never changes your data.</p></div></div>','<button class="btn ghost" data-action="connect-back">Back</button><button class="btn primary" data-action="connect-submit">'+ic('check')+'Connect</button>');
 }
 if(sh.type==='newSkill')return shell('New skill','Start from a template or from scratch.','<div class="tpls" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">'+STPL.map((t)=>'<button class="tpl" data-action="create-skill" data-id="'+t.id+'"><strong>'+t.label+'</strong><span>'+t.hint+'</span></button>').join('')+'</div>','');
 return '';
}

/* ---------- render ---------- */
function render(){
 const sb=$('.sheet-body');const st=sb?sb.scrollTop:0;
 $('#mtop').innerHTML='<div class="brand">'+LOGO+'<span>Foreman</span></div>'+whoBtn(true);
 $('#rail').innerHTML=railHTML();
 $('#tabbar').innerHTML=tabHTML();
 const v={agents:viewAgents,agent:viewAgent,skills:viewSkills,skill:viewSkill,sources:viewSources,policies:viewPolicies}[S.view];
 $('#main').innerHTML=v();
 $('#sheetHost').innerHTML=S.sheet?sheetHTML():'';
 document.body.style.overflow=S.sheet?'hidden':'';
 const nb=$('.sheet-body');if(nb)nb.scrollTop=st;
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
}
let tt=null;
function toast(msg){
 const t=$('#toast');t.innerHTML=ic('check',16)+esc(msg);t.classList.add('show');
 clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);
}
function go(view,id){
 S.view=view;S.tab='config';S.sheet=null;
 if(view==='agent')S.agentId=id;
 if(view==='skill'){S.skillId=id;const s=skillById(id);S.tryIn=s.ex.in;S.tryState='idle'}
 window.scrollTo(0,0);render();
}
const toggle=(arr,id)=>{const i=arr.indexOf(id);i>-1?arr.splice(i,1):arr.push(id)};

/* ---------- actions ---------- */
function act(a,d){
 const ag=S.agentId?agentById(S.agentId):null;
 const sk=S.skillId?skillById(S.skillId):null;
 if(S.sheet&&S.sheet.readonly&&/^rule-/.test(a)&&a!=='rule-check')return;
 switch(a){
  case 'open-guard':go('agent',d.id);S.tab='guard';return render();
  case 'g-pii':case 'g-special':case 'g-region':case 'g-ret':case 'g-limit':ag.guard[GKEY[a]]=d.v;return render();
  case 'toggle-appr':toggle(ag.guard.approvals,d.v);return render();
  case 'toggle-guard':ag.guard[d.v]=!ag.guard[d.v];return render();
  case 'fix':{const c=CTRL.find((x)=>x.k===d.v);if(c.fix){c.fix(ag.guard);render();return toast('Guardrail turned on')}render();const pe=$('#gPurpose');if(pe)pe.focus();return}
  case 'guard-prompt':return sendChat(GTESTS[+d.i][0]);
  case 'p-tab':S.ptab=d.v;return render();
  case 'p-ret':if(!isAdmin())return toast('Only admins can change workspace rules');S.policy.retention=d.v;return render();
  case 'p-toggle':{if(!isAdmin())return toast('Only admins can change workspace rules');S.policy[d.v]=!S.policy[d.v];let n=0;if(S.policy[d.v]){S.agents.forEach((x)=>{const g=x.guard;if(d.v==='pii'&&g.pii==='allow'){g.pii='mask';n++}if(d.v==='special'&&g.special==='allow'){g.special='block';n++}if(d.v==='eu'&&g.region!=='eu'){g.region='eu';n++}})}render();return toast(n?plural(n,'agent')+' adjusted':'Rule updated')}
  case 'audit-filter':S.auditFilter=d.v;return render();
  case 'export-log':return toast('Prototype: export is not connected');
  case 'rec-done':{S.records.find((r)=>r.id===d.id).status='done';render();return toast('Marked as done')}
  case 'dsr-find':return toast('Prototype: would search all '+S.sources.length+' sources');
  case 'dsr-done':{S.dsr.find((r)=>r.id===d.id).done=true;render();return toast('Request completed')}
  case 'new-rule':S.sheet=newRuleSheet(null,null);return render();
  case 'new-rule-for-agent':S.sheet=newRuleSheet(null,S.agentId);return render();
  case 'edit-rule':{const r=S.rules.find((x)=>x.id===d.id);S.sheet=r.pending?{type:'review',id:r.id}:newRuleSheet(r.id,null);return render()}
  case 'toggle-rule':{if(!isAdmin())return toast('Only admins can turn rules on or off');const r=S.rules.find((x)=>x.id===d.id);r.on=!r.on;logAudit('Workspace','Guardrail \u201c'+r.name+'\u201d turned '+(r.on?'on':'off')+' by '+me().name,'Allowed');render();return toast(r.name+(r.on?' is on':' is off'))}
  case 'rule-action':S.sheet.draft.action=d.v;S.sheet.check=null;return render();
  case 'rule-scope':S.sheet.draft.scope=d.v;return render();
  case 'rule-agent':toggle(S.sheet.draft.agents,d.id);return render();
  case 'rule-check':S.sheet.check=checkRule(S.sheet.draft);return render();
  case 'rule-save':return saveRule();
  case 'rule-delete':{if(!S.sheet.confirmDel){S.sheet.confirmDel=true;return render()}const r=S.rules.find((x)=>x.id===S.sheet.id);S.rules=S.rules.filter((x)=>x.id!==r.id);logAudit('Workspace','Guardrail \u201c'+r.name+'\u201d deleted by '+me().name,'Allowed');S.sheet=null;render();return toast('Guardrail deleted')}
  case 'pick-rule':S.sheet={type:'pickRule'};return render();
  case 'toggle-rule-agent':{const r=S.rules.find((x)=>x.id===d.id);if(r.pending)return toast('This rule already has a change waiting for approval');if(!isAdmin()&&myAgents().indexOf(ag.id)<0)return toast('You can only change rules for agents you own');const has=r.agents.indexOf(ag.id)>-1;proposeChange(r,{agents:has?r.agents.filter((x)=>x!==ag.id):r.agents.concat(ag.id)},(has?'Removed from ':'Applied to ')+ag.name);return render()}
  case 'unassign-rule':{const r=S.rules.find((x)=>x.id===d.id);if(r.pending)return toast('This rule already has a change waiting for approval');proposeChange(r,{agents:r.agents.filter((x)=>x!==ag.id)},'Removed from '+ag.name);return render()}
  case 'rule-approve':return approveRule(d.id);
  case 'rule-reject':return rejectRule(d.id);
  case 'rule-withdraw':return withdrawRule(d.id);
  case 'who':S.sheet={type:'who'};return render();
  case 'set-who':S.me=d.id;S.sheet=null;render();return toast('Viewing as '+me().name);
  case 'rule-prompt':return sendChat(S.rules.find((x)=>x.id===d.id).sample);
  case 'nav':return go(d.view);
  case 'open-agent':return go('agent',d.id);
  case 'open-skill':return go('skill',d.id);
  case 'tab':S.tab=d.v;return render();
  case 'hide-banner':S.bannerHidden=true;return render();
  case 'filter-agents':S.agentFilter=d.v;return render();
  case 'filter-skills':S.skillFilter=d.v;return render();
  case 'toggle-status':{const x=agentById(d.id);x.status=x.status==='active'?'paused':'active';render();return toast(x.name+(x.status==='active'?' is active':' is paused'))}
  case 'save-agent':return toast('Changes saved');
  case 'set-autonomy':ag.autonomy=d.v;return render();
  case 'reset-chat':delete S.chats[ag.id];return render();
  case 'prompt':return sendChat(ag.prompts[+d.i],+d.i);
  case 'pick-skill':S.sheet={type:'pickSkill'};return render();
  case 'pick-source':S.sheet={type:'pickSource'};return render();
  case 'toggle-skill':toggle(ag.skills,d.id);return render();
  case 'toggle-source':toggle(ag.sources,d.id);return render();
  case 'remove-skill':toggle(ag.skills,d.id);return render();
  case 'remove-source':toggle(ag.sources,d.id);return render();
  case 'close-sheet':S.sheet=null;return render();
  case 'new-agent':S.sheet={type:'newAgent',step:1,draft:{tpl:null,name:'',role:'',skills:[],sources:[]}};return render();
  case 'draft-tpl':{const t=TPLS.find((x)=>x.id===d.id),dr=S.sheet.draft;dr.tpl=t.id;dr.name=t.name;dr.role=t.role;dr.skills=t.skills.slice();dr.sources=t.sources.slice();dr.err='';return render()}
  case 'draft-next':{const dr=S.sheet.draft;if(S.sheet.step===1&&!dr.name.trim()){dr.err='Give your agent a name.';return render()}S.sheet.step++;return render()}
  case 'draft-back':S.sheet.step--;return render();
  case 'draft-source':toggle(S.sheet.draft.sources,d.id);return render();
  case 'draft-skill':toggle(S.sheet.draft.skills,d.id);return render();
  case 'create-agent':{
   const dr=S.sheet.draft,name=dr.name.trim(),role=dr.role.trim()||'New agent';
   const n={id:uid('a'),name:name,role:role,emblem:(S.agents.length%4)+1,status:'active',autonomy:'ask',model:'balanced',skills:dr.skills.slice(),sources:dr.sources.slice(),lastRun:'never',runs:0,instructions:'You are '+name+'. '+role,prompts:['What can you help me with?'],guard:defaultGuard(role)};
   S.agents.push(n);go('agent',n.id);return toast('Agent created');
  }
  case 'connect':S.sheet={type:'connect',step:1,kind:null,name:'',loc:'',assign:null};return render();
  case 'connect-for-agent':S.sheet={type:'connect',step:1,kind:null,name:'',loc:'',assign:S.agentId};return render();
  case 'connect-kind':S.sheet.kind=d.v;S.sheet.step=2;return render();
  case 'connect-back':S.sheet.step=1;return render();
  case 'connect-submit':{
   const c=S.sheet;if(!c.name.trim()){c.err='Give this source a name.';return render()}
   const k=KINDS[c.kind];const n={id:uid('src'),name:c.name.trim(),kind:c.kind,detail:c.loc.trim()||k.ph,count:20+Math.floor(Math.random()*380),synced:'just now',syncing:true};
   S.sources.push(n);if(c.assign&&agentById(c.assign))agentById(c.assign).sources.push(n.id);
   S.sheet=null;render();toast(n.name+' connected');
   setTimeout(()=>{n.syncing=false;if(S.view==='sources'||S.view==='agent')render()},1600);return;
  }
  case 'sync':{const s=srcById(d.id);s.syncing=true;s.stale=false;render();setTimeout(()=>{s.syncing=false;s.synced='just now';if(S.view==='sources')render()},1500);return}
  case 'new-skill':S.sheet={type:'newSkill'};return render();
  case 'create-skill':{
   const t=STPL.find((x)=>x.id===d.id).v;const n=JSON.parse(JSON.stringify(t));n.id=uid('s');n.version=1;
   S.skills.push(n);const back=S.agentId&&S.view==='agent'?agentById(S.agentId):null;
   if(back)back.skills.push(n.id);go('skill',n.id);return toast('Skill created');
  }
  case 'set-type':sk.type=d.v;return render();
  case 'set-output':sk.output=d.v;return render();
  case 'toggle-tool':toggle(sk.tools,d.v);return render();
  case 'save-skill':sk.version++;render();return toast('Skill saved');
  case 'run-skill':S.tryState='running';render();setTimeout(()=>{S.tryState='done';if(S.view==='skill')render()},900);return;
 }
}
document.addEventListener('click',(e)=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled)return;
 act(el.dataset.action,el.dataset);
});
document.addEventListener('keydown',(e)=>{
 if(e.key==='Escape'&&S.sheet){S.sheet=null;render();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-action]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',(e)=>{
 const t=e.target,k=t.dataset&&t.dataset.input;if(!k)return;
 if(k==='agentQuery'){S.agentQuery=t.value;$('#agentGrid').innerHTML=agentGrid();return}
 if(k==='skillQuery'){S.skillQuery=t.value;$('#skillGrid').innerHTML=skillGrid();return}
 if(k==='tryIn'){S.tryIn=t.value;return}
 const p=k.split('.');
 if(p[0]==='agent'){agentById(S.agentId)[p[1]]=t.value;if(p[1]==='name'){const e1=$('.ah .emb');if(e1)e1.textContent=initials(t.value)}}
 if(p[0]==='skill')skillById(S.skillId)[p[1]]=t.value;
 if(p[0]==='guard')agentById(S.agentId).guard[p[1]]=t.value;
 if(p[0]==='draft')S.sheet.draft[p[1]]=t.value;
 if(p[0]==='conn')S.sheet[p[1]]=t.value;
});
document.addEventListener('submit',(e)=>{
 if(e.target.id==='chatForm'){e.preventDefault();const i=$('#chatInput');const v=i.value;i.value='';sendChat(v)}
});
render();
})();
</script>
