apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenticpilot
  annotations:
    # ingress-nginx: cookie-based sticky sessions and long timeouts for Vaadin push connections
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: AP_ROUTE
    nginx.ingress.kubernetes.io/session-cookie-samesite: Lax
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [agenticpilot.example.com]
      secretName: agenticpilot-tls
  rules:
    - host: agenticpilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: agenticpilot, port: {name: http}}
